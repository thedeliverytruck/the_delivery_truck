name: the_delivery_truck
description: The Delivery Truck app for scheduling local large-item deliveries.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Firebase & Cloud
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  firebase_storage: ^12.4.6
  firebase_messaging: ^15.2.6
  cloud_functions: ^5.5.1

  # Location & Maps
  geolocator: ^14.0.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.6.0
  flutter_google_places: ^0.3.0
  google_maps_webservice: ^0.0.20-nullsafety.5
  google_maps_cluster_manager: ^2.0.0

  # Stripe
  flutter_stripe: ^11.5.0

  # UI & Interactions
  webview_flutter: ^4.13.0
  flutter_local_notifications: ^18.0.1
  flutter_rating_bar: ^4.0.1
  intl: ^0.17.0
  url_launcher: ^6.2.5
  share_plus: ^7.2.1
  confetti: ^0.6.0
  audioplayers: ^6.4.0
  screenshot: ^1.2.3

  # Charts
  charts_flutter: ^0.12.0

  # File/Media Uploads
  image_picker: ^1.0.4
  file_picker: ^6.1.1
  path_provider: ^2.1.2

  # HTTP & JS
  http: ^0.13.6
  js: ^0.6.7

  # Storage & Preferences
  shared_preferences: ^2.2.2

  # Export
  csv: ^5.0.2
  pdf: ^3.10.4
  printing: ^5.11.0

  # Icons
  lucide_icons: ^0.257.0

  # Background Tasks
  background_fetch: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/icon.png
    - assets/icon/icon2.png
    - assets/fonts/
    - assets/sounds/horn.mp3

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#000000"
    theme_color: "#000000"

flutter_native_splash:
  color: "#000000"
  image: assets/icon/icon.png
  branding: null
  android: true
  ios: true
  web: true
