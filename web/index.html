<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="The Delivery Truck helps users request local large-item delivery services.">
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="The Delivery Truck" />
    <meta name="author" content="The Delivery Truck" />
    <meta name="keywords" content="delivery, truck, local delivery, large item, service, moving">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>The Delivery Truck</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="canonical" href="https://www.thedeliverytruck.com" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Social Sharing (OG) -->
    <meta property="og:title" content="The Delivery Truck" />
    <meta property="og:description" content="Schedule fast, reliable large-item delivery with local drivers." />
    <meta property="og:url" content="https://www.thedeliverytruck.com" />
    <meta property="og:image" content="icons/Icon-512.png" />

    <link rel="stylesheet" href="styles.css" />

    <!-- ✅ Google Maps JavaScript SDK with Places -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCh-O9NUty2VEG6R0nQIbl5MQFV6GgHXVg&libraries=places"></script>

    <!-- ✅ Firebase JS SDKs for Web Compatibility -->
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-messaging-compat.js"></script>

    <style id="splash-screen-style">
      html {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100%;
        background-color: #000000;
        background-size: 100% 100%;
      }

      .center {
        margin: 0;
        position: absolute;
        top: 50%;
        left: 50%;
        -ms-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
      }

      .contain {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .stretch {
        display: block;
        width: 100%;
        height: 100%;
      }

      .cover {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .bottom {
        position: absolute;
        bottom: 0;
        left: 50%;
        -ms-transform: translate(-50%, 0);
        transform: translate(-50%, 0);
      }

      .bottomLeft {
        position: absolute;
        bottom: 0;
        left: 0;
      }

      .bottomRight {
        position: absolute;
        bottom: 0;
        right: 0;
      }
    </style>

    <script id="splash-screen-script">
      function removeSplashFromWeb() {
        document.getElementById("splash")?.remove();
        document.getElementById("splash-branding")?.remove();
        document.body.style.background = "transparent";
      }
    </script>
  </head>

  <body>
    <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
    </picture>

    <!-- ✅ Your compiled Flutter app -->
    <script src="main.dart.js" type="application/javascript"></script>
  </body>
</html>
